<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>공공고 - 채용 공고</title>
    <link rel="stylesheet" href="/static/app.css?v=20260825-1">
    <link rel="stylesheet" href="/static/news.css?v=20260825-1">
</head>
<body>
    <main class="dashboard-shell">
        <nav class="primary-tabs" aria-label="기본 보기">
            <button id="jobs-primary-tab" type="button" class="selected" data-primary-tab="jobs" aria-pressed="true" aria-controls="job-view">채용공고</button>
            <button id="news-primary-tab" type="button" data-primary-tab="news" aria-pressed="false" aria-controls="news-view">뉴스/기관소식</button>
        </nav>

        <section id="job-view" aria-labelledby="jobs-primary-tab">
        <header class="app-header">
            <div>
                <p class="eyebrow">GONGGONGGO</p>
                <h1>공공 채용 공고</h1>
            </div>
            <div class="header-actions">
                <button id="crawl-button" class="primary-button" type="button" disabled>새로 수집</button>
                <button id="settings-button" class="secondary-button" type="button" aria-controls="settings-drawer" aria-expanded="false">설정</button>
            </div>
        </header>

        <section class="crawl-region" aria-live="polite">
            <span id="crawl-status">수집 상태를 확인하는 중입니다.</span>
            <span id="crawl-errors"></span>
        </section>

        <section class="toolbar" aria-label="공고 필터">
            <label>검색 <input id="search-input" type="search" placeholder="기관명, 직무, 제목 검색"></label>
            <label>카테고리 <select id="category-filter"><option value="">전체 카테고리</option></select></label>
            <label>정렬 <select id="sort-select"><option value="deadline">마감 임박순</option><option value="recent">최근 확인순</option></select></label>
        </section>

        <nav class="group-tabs" aria-label="넓은 화면 보기">
            <button type="button" class="selected" data-group-tab="active">진행 중</button>
            <button type="button" data-group-tab="archive">보관함</button>
        </nav>

        <section class="wide-view" data-view-group="active">
            <section class="lane" data-lane="review_pending">
                <h2>검토 대기 <span data-count="review_pending">0</span></h2>
                <div class="card-list" data-post-list="review_pending"></div>
            </section>
            <section class="lane" data-lane="planned">
                <h2>지원 예정 <span data-count="planned">0</span></h2>
                <div class="card-list" data-post-list="planned"></div>
            </section>
        </section>

        <section class="wide-view" data-view-group="archive" hidden>
            <section class="lane" data-lane="applied">
                <h2>지원 완료 <span data-count="applied">0</span></h2>
                <div class="card-list" data-post-list="applied"></div>
            </section>
            <section class="lane" data-lane="excluded">
                <h2>제외 <span data-count="excluded">0</span></h2>
                <div class="card-list" data-post-list="excluded"></div>
            </section>
        </section>

        <section class="narrow-view" aria-label="상태별 공고">
            <nav class="status-tabs" aria-label="공고 상태">
                <button type="button" class="selected" data-status-tab="review_pending">검토 대기</button>
                <button type="button" data-status-tab="planned">지원 예정</button>
                <button type="button" data-status-tab="applied">지원 완료</button>
                <button type="button" data-status-tab="excluded">제외</button>
            </nav>
            <section class="status-panel" data-status-panel="review_pending">
                <h2>검토 대기 <span data-count="review_pending">0</span></h2>
                <div class="card-list" data-post-list="review_pending"></div>
            </section>
            <section class="status-panel" data-status-panel="planned" hidden>
                <h2>지원 예정 <span data-count="planned">0</span></h2>
                <div class="card-list" data-post-list="planned"></div>
            </section>
            <section class="status-panel" data-status-panel="applied" hidden>
                <h2>지원 완료 <span data-count="applied">0</span></h2>
                <div class="card-list" data-post-list="applied"></div>
            </section>
            <section class="status-panel" data-status-panel="excluded" hidden>
                <h2>제외 <span data-count="excluded">0</span></h2>
                <div class="card-list" data-post-list="excluded"></div>
            </section>
        </section>
        </section>

        <section id="news-view" hidden aria-labelledby="news-primary-tab">
            <header class="app-header news-header">
                <div>
                    <p class="eyebrow">GONGGONGGO</p>
                    <h1>뉴스/기관소식</h1>
                </div>
                <div class="header-actions">
                    <button id="news-crawl-button" class="primary-button" type="button" disabled>새로 수집</button>
                </div>
            </header>

            <section class="crawl-region news-crawl-region" aria-live="polite">
                <span id="news-crawl-status">수집 상태를 확인하는 중입니다.</span>
                <span id="news-crawl-errors"></span>
            </section>

            <section class="news-toolbar" aria-label="뉴스 필터">
                <div class="news-filter-row news-types" role="group" aria-label="자료 종류">
                    <button type="button" class="selected" data-news-type="" aria-pressed="true">전체</button>
                    <button type="button" data-news-type="newspaper" aria-pressed="false">뉴스</button>
                    <button type="button" data-news-type="institution" aria-pressed="false">기관소식</button>
                </div>
                <div class="news-filter-row news-periods" role="group" aria-label="기간">
                    <button type="button" class="selected" data-news-period="today" aria-pressed="true">오늘</button>
                    <button type="button" data-news-period="yesterday" aria-pressed="false">어제</button>
                    <button type="button" data-news-period="3d" aria-pressed="false">최근 3일</button>
                    <button type="button" data-news-period="7d" aria-pressed="false">최근 7일</button>
                    <button type="button" data-news-period="30d" aria-pressed="false">최근 30일</button>
                </div>
                <div class="news-filter-row news-checkboxes" role="group" aria-label="출처">
                    <label><input type="checkbox" name="news-source" value="hankyung" checked> 한국경제</label>
                    <label><input type="checkbox" name="news-source" value="mk" checked> 매일경제</label>
                    <label><input type="checkbox" name="news-source" value="reb" checked> 한국부동산원</label>
                    <label><input type="checkbox" name="news-source" value="kodit" checked> 신용보증기금</label>
                    <label><input type="checkbox" name="news-source" value="kogas" checked> 한국가스공사</label>
                </div>
                <div class="news-filter-row news-checkboxes" role="group" aria-label="분류">
                    <label><input type="checkbox" name="news-category" value="주요뉴스" checked> 주요뉴스</label>
                    <label><input type="checkbox" name="news-category" value="정치" checked> 정치</label>
                    <label><input type="checkbox" name="news-category" value="경제" checked> 경제</label>
                    <label><input type="checkbox" name="news-category" value="사회" checked> 사회</label>
                    <label><input type="checkbox" name="news-category" value="IT" checked> IT</label>
                    <label><input type="checkbox" name="news-category" value="세계" checked> 세계</label>
                    <label><input type="checkbox" name="news-category" value="보도자료" checked> 보도자료</label>
                    <label><input type="checkbox" name="news-category" value="정기 통계" checked> 정기 통계</label>
                </div>
                <input id="news-search-input" class="news-search-input" type="search" aria-label="제목 검색" placeholder="제목 검색">
            </section>

            <p id="news-count" class="news-count" aria-live="polite">총 0건</p>
            <p id="news-errors" class="news-error-message" role="alert" hidden></p>
            <section id="news-list" class="news-list" aria-live="polite" aria-busy="false"></section>
        </section>
    </main>

    <aside id="settings-drawer" class="settings-drawer" aria-label="설정" hidden>
        <div class="settings-heading"><h2>설정</h2><button id="settings-close" type="button" aria-label="설정 닫기">×</button></div>
        <form id="settings-form">
            <fieldset><legend>동시 수집 작업 수</legend>
                <label><input type="radio" name="concurrency" value="1"> 1</label>
                <label><input type="radio" name="concurrency" value="2"> 2</label>
                <label><input type="radio" name="concurrency" value="4"> 4</label>
            </fieldset>
            <label class="toggle-label"><input id="open-browser" type="checkbox"> 시작 시 브라우저 열기</label>
            <section><h3>대상 기관 키워드</h3><div id="institution-keywords" class="keyword-editor"></div><label>키워드 추가 <input id="institution-keyword-input" type="text"></label></section>
            <section><h3>IT 직무 키워드</h3><div id="role-keywords" class="keyword-editor"></div><label>키워드 추가 <input id="role-keyword-input" type="text"></label></section>
            <button class="primary-button" type="submit">설정 저장</button>
        </form>
        <section class="deleted-links-section"><h3>영구 삭제한 링크</h3><p>차단을 해제하면 다음 수집에서 공고가 다시 나타날 수 있습니다.</p><ul id="deleted-links"></ul></section>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="error-message" class="error-message" role="alert" hidden></div>
    <noscript>
        <section aria-label="스크립트 없이 볼 수 있는 공고 목록">
            {% for post in posts %}
            <p><a href="{{ post.link }}">{{ post.original_title }}</a></p>
            {% endfor %}
        </section>
    </noscript>
    <script src="/static/app.js?v=20260825-3" defer></script>
    <script src="/static/news.js?v=20260825-1" defer></script>
</body>
</html>
